# The sites the guides point to (docs/features/guides.md). Names and descriptions: research_sites.<key> in config/locales.
# years: the span the records cover; only sites with years are suggested on a person's profile.
# adult: the person must have been of fighting age (16 to 50) at some point in that span.
# search: a link template the person's name is filled into (surname, first_name, patronymic).
# Many Russian state sites refuse connections from abroad — check those from a Russian connection.

pamyat_naroda:
  url: https://pamyat-naroda.ru/
  tier: official
  guide: military
  years: [1941, 1945]
  adult: true
  search: "https://pamyat-naroda.ru/heroes/?adv_search=y&last_name=%{surname}&first_name=%{first_name}&middle_name=%{patronymic}&group=all"
  checked_on: 2026-11-21

