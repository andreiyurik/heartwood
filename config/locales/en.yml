  guides:
    index:
      title: Where to look for your ancestors
      description: Short guides to the archives and databases of the former USSR — for ancestors who fought in a war, were repressed or were baptised before 1918 — and how to write to an archive.
    start:
      title: "Where to start looking for your ancestors: a route, step by step"
      description: How to build a family tree — ask the family, gather the papers, work out which archive holds the record, and find it. Answer three questions and get a route for your own family.
    military:
      title: How to find an ancestor who fought in the war
      description: The Second and the First World War — where to find service cards, awards and loss reports. Pamyat Naroda, OBD Memorial, Podvig Naroda, Heroes of the Great War.
    metric_books:
      title: Russian parish registers — finding a birth record before 1918
      description: How to work out which archive and which church's registers to search, where to see parish register scans online, and how to read them.
    repressions:
      title: How to find an ancestor who was repressed or dispossessed
      description: Databases of Soviet political repression victims and memory books, and how to request the case file and a rehabilitation certificate.
    archive_request:
      title: How to write to an archive or registry office in Russia
      description: Where to ask for an ancestor's birth, marriage or death certificate, what to put in the request — and a ready letter in Russian.
    ai_research:
      title: Researching your family with an AI agent
      description: How an AI agent with the open ex-ussr-kinship-research skill searches the archives of the former USSR — and how to bring what it finds into your family tree.
    sites: Where to look
    regional_sites: By country and region
    copy: Copy the text
    credit_html: "These guides are based on the methodology and source catalog of %{skill}, an open project by Denis Shiryaev (MIT license)."
    cta:
      title: Found a document? Keep it in the tree
      lede: Add the person, attach the source and note where the original is kept. Send the family a link — everyone adds what they remember, and nothing gets lost in a chat.
      start: Start for free
      open_tree: Open the tree
  research_route:
    form:
      title: Your route
      lede: Answer three questions about the person you are looking for and see the steps for their time and fate. No names asked.
      era: Which time
      fate: What is known
      region: Where
      any_region: Another region, or not sure
      show: Show the route
    eras:
      any: Any
      empire: Before 1918
      soviet: 1918–1945
      later: After 1945
    fates:
      war: War
      repressed: Repression or exile
      labour: Captivity or forced labour in Germany
      unknown: Nothing is known
    ask_family: Ask the family by link
    more: "In detail: %{guide}"
    done: Done
    progress: "Steps done: %{done} of %{total}"
    copy: Copy the link to this route
    steps:
      ask:
        title: Ask the family
        text: Start with those who remember. Ask them simply to tell the story first, and only then ask further — “what do you remember yourself, and what did you hear from others?”, “is there a letter about it, or a note on a photograph?”. Don't suggest names or dates; people readily agree with your version. Write down who told you, and when.
      papers:
        title: Gather the papers at home
        text: Birth, marriage and death certificates, a military service book, a work record book, letters, notes on the backs of photographs. From each you need three things — the full name, a date and a place. Photograph the document; it becomes the first source in the tree.
      place:
        title: Find out what the place was then
        text: A record is kept where it was made. Work out which governorate, district, volost and parish — or which raion and village council — the village belonged to in the year of the event. Borders and names changed, and villages of the same name turn up in neighbouring districts. Today's map only tells you which archive it all ended up in.
      metric_books:
        title: Find the entry in the parish register
        text: Before 1918, births, marriages and deaths were recorded by the church, synagogue or mosque. The books are kept in the regional archive, and many are scanned. A birth entry names the parents and godparents; a marriage entry gives ages and where each came from. That is the thread to the generation before.
      ww1:
        title: Check the First World War records
        text: For the soldiers of 1914–1918 there are casualty cards, hospital lists and award lists. A card gives the governorate, district, volost and village — which lead you to the parish register.
      ww2:
        title: Find the military records
        text: Those who fought in 1941–1945 left service cards, award citations and casualty reports. Open the document itself, not just the index card — a casualty report may give the place of conscription, the family's address and the name of a wife or mother. That is what tells your ancestor from a namesake.
      repressions:
        title: Check the databases of the repressed
        text: People who were arrested, dispossessed or exiled are looked for in memorial books and combined databases. A database entry is only a pointer; it says where the case file is kept. Relatives have the right to request it and to receive a certificate of rehabilitation.
      labour:
        title: Check the records of captivity and forced labour
        text: Prisoners of war and forced labourers left registration cards and camp documents. Those who returned were screened, and those filtration files are kept in regional archives — you ask for them in writing.
      names:
        title: Search under other spellings
        text: Clerks made mistakes, and names changed form — Paraskeva and Praskovya, Ivanov and Ivanenko, no patronymic, a birth year a year or two off. Write the name down as the document has it, and try the variants separately. Dates before February 1918 are Old Style — 12 days behind in the 19th century, 13 in the 20th.
      request:
        title: Write to where the record is kept
        archive: What isn't online is in the archive. Write to the archive of the region where the record was made — who you are looking for, what the event was, the year or range of years, the place and the parish. One question per letter gets answered sooner.
        zags: Records after 1918 are kept by the civil registry (ZAGS). A duplicate certificate or an extract is issued to relatives who can prove the relationship. You can apply through Gosuslugi or by letter to the registry office where the event took place; records over a hundred years old are passed to the archive.
      keep:
        title: Write the find down with its source
        text: Write down where it was found — archive, fond, opis, file, sheet, or a link — and what it says, word for word. Note how well it is proven — a guess, one document, or several independent ones. A matching name is not yet kinship.
  research_sites:
    tiers:
      official: archive or state database
      project: project or index
      community: community
    regions:
      moscow: Moscow
      sverdlovsk: Sverdlovsk region
      rostov: Rostov region
      ukraine: Ukraine
      belarus: Belarus
      latvia: Latvia
      poland: Poland
      kazakhstan: Kazakhstan
    pamyat_naroda:
      name: Pamyat Naroda (Memory of the People)
      about: The Russian Ministry of Defence's main Second World War database — service cards, award documents, loss reports, a unit's combat path. In Russian.
    obd_memorial:
      name: OBD Memorial
      about: Soldiers killed or missing in 1941–1945 — loss reports, death notices, burial and prisoner-of-war records. In Russian.
    podvig_naroda:
      name: Podvig Naroda (Feat of the People)
      about: Award sheets and award orders. Part of it has moved into Pamyat Naroda. In Russian.
    rkka_wiki:
      name: Index of Red Army units
      about: Field post numbers and units of the Red Army — to work out which unit a letter or a document names.
    gwar:
      name: Heroes of the Great War 1914–1918
      about: The First World War — loss cards, hospitals, awards, captivity. A garbled village name on one card often becomes clear from other cards of the same volost. In Russian.
    arolsen:
      name: Arolsen Archives
      about: Forced labourers taken to Germany, camp prisoners and displaced persons, 1939 to the 1950s. Search in English, German or Russian.
    metric_books_familysearch:
      name: FamilySearch Catalog
      about: Millions of filmed parish registers, revision lists and confession lists of the Russian Empire. Search by place; free, with an account.
    uiad:
      name: Remote access to archival documents (GIS UIAD)
      about: Scans of files from Russia's federal and regional archives, to read from home. In Russian.
    cgamos:
      name: Moscow Main Archive — parish registers
      about: Scans of the parish registers of Moscow's churches. In Russian.
    gaso_metriki:
      name: State Archive of Sverdlovsk Region — parish registers
      about: Scans of the parish registers of Yekaterinburg uyezd and its neighbours in Perm governorate. In Russian.
    donarch:
      name: State Archive of Rostov Region — parish registers
      about: Scans of the parish registers of the Don Host Oblast. In Russian.
    duck_inspector:
      name: Duck Inspector
      about: Searches the Ukrainian archives' sites for parish register and inventory scans in one go.
    niab:
      name: National Historical Archives of Belarus
      about: Parish registers, revision lists and records of the Belarusian governorates.
    raduraksti:
      name: Raduraksti
      about: Scans of the parish registers of every faith in Latvia and Courland, censuses and revisions.
    geneteka:
      name: Geneteka
      about: An index of Polish parish records, including the lands once in the Russian Empire.
    parish_map:
      name: Parish map
      about: Shows which church a village belonged to — without that you don't know whose registers to search.
    retromap:
      name: Retromap
      about: Old maps over the modern one — to find a vanished village and its neighbours.
    vgd:
      name: VGD forum
      about: The largest Russian-language genealogy forum — people there know the fond and opis numbers for an uyezd. Leads, not proof.
    openlist:
      name: Open List
      about: A free database of the victims of political repression in the USSR, with a source for every entry.
    memsearch:
      name: Memorial's search
      about: Searches many databases of repression victims, memory books and lists of dispossessed peasants at once. In Russian.
    vozvrashchennye_imena:
      name: Returned Names
      about: Memory books of repression victims, mostly Leningrad and its region, from the National Library of Russia. In Russian.
    posledny_adres:
      name: Last Address
      about: Plaques on the houses people were taken from, and their stories — search by name and street. In Russian.
    e_memory_kz:
      name: e-memory.kz
      about: Kazakhstan's state rehabilitation commission — repression victims, special settlers, deported peoples.
    reabit_ua:
      name: Rehabilitated by History
      about: Ukraine's national bank of repressed people.
    archive_guides:
      name: Guides to the archives of Russia
      about: Which fonds every state archive holds — where you find out whom to write to. In Russian.
    gosuslugi:
      name: Gosuslugi
      about: A repeat birth, marriage or death certificate and civil registry extracts, for records still kept by a registry office. Needs a Russian account.
    minjust_abroad:
      name: Russian Ministry of Justice — documents from abroad
      about: How to get a civil registry certificate from another country, such as Ukraine or Kazakhstan. In Russian.
    garf:
      name: State Archive of the Russian Federation
      about: Records of Russia's and the USSR's highest authorities — including rehabilitation and emigration files. In Russian.
  landing:
    meta:
      title: "%{app} — the family tree your whole family builds"
      description: Start a family tree and send your relatives a link — everyone adds what they remember. Changes show up for everyone at once, and your data stays yours. Free.
    hero:
      eyebrow: A family tree for the whole family
      title_html: "Gather your family's story together — %{mark}"
      title_mark: while you can still ask
      lede: Start a tree and send your relatives a link — everyone adds what they remember. Grandma knows her mother's maiden name, an uncle knows where grandpa served, and you see it all at once, on one tree.
      start_label: Your family's name
      start_placeholder: Your family's name
      demo: See an example — the Rurikids' tree
      cta: Start for free
      sign_in: Sign in
      note: "Free up to %{limit} people. No card, no ads."
      image_alt: A family tree in %{app}
    scene:
      family: Your family
      tree: "A family tree: you, mum and dad, Grandma Anna, Grandpa Nikolai and great-grandmother Praskovya, whom Aunt Vera helped to find"
      before: 5 people · 3 generations
      after: 6 people · 4 generations
      chat: Family chat
      ask_text: "What was Grandma Anna's mother called?"
      ask_link: Answer by link
      typing: "%{name} is typing"
      answer: Aunt Vera
      answer_via: by link, no sign-up
      answer_text: Praskovya Ilyinichna, from near Vyatka. Found her photo!
      replay: Play again
      people:
        you: { name: You, kin: "" }
        mother: { name: Olga, kin: mum }
        father: { name: Sergei, kin: dad }
        grandmother: { name: Anna, kin: grandma }
        grandfather: { name: Nikolai, kin: grandpa }
        found: { name: Praskovya, kin: great-grandma }
    pain:
      title: A family's memory fades quietly
      before: Now
      after: With %{app}
      stories_after: The stories are written down — next to the person they're about.
      photos_after: Every photo has a name and a place in the tree.
      pieces_after: All the pieces come together in one tree the whole family sees.
      stories_title: Nobody wrote the stories down
      stories_text: What grandparents remember lives only in their memory. We put off asking every year — until there's no one left to ask.
      photos_title: Photos without names
      photos_text: Old prints sit in boxes and family chats. A generation from now, nobody will know who's in them.
      pieces_title: Everyone holds one piece
      pieces_text: An aunt knows one branch, a cousin another. Together it's the family's story; apart, it's fragments.
    how:
      title: How it works
      create_title: Start a tree
      create_text: Begin with yourself, your parents and grandparents — a couple of minutes. Or upload an existing tree from a GEDCOM file.
      invite_title: Send relatives a link
      invite_text: One link in the family chat, and relatives join the tree to add to it.
      together_title: Fill it in together
      together_text: Changes appear for everyone at once, no reload. Every edit is in the history, and any mistake can be undone.
    why:
      title: Why your family's story matters
      lede: It's not only about the past. It's about who your children grow up to be.
      research: Emory University psychologists Marshall Duke and Robyn Fivush found that children who know their family's stories — how their parents met, what their grandparents went through — have more confidence and cope better with hardship. They feel part of something bigger than themselves.
      roots_title: People, not dates
      roots_text: Not just a list of names but who they were, where they lived, what they lived through. A story you can tell.
      legacy_title: Something to hand down
      legacy_text: A tree outlives phones and social networks. You leave your children and grandchildren what you may never have had.
      talk_title: A reason to talk
      talk_text: Asking grandma about her youth may be the best conversation you've had in years. A tree gives you the reason.
    features:
      title: Everything you need to build a tree properly
      live_title: Together, in real time
      live_text: Several relatives edit one tree at once — everyone sees changes immediately.
      history_title: History and undo
      history_text: See who changed what. Bring back someone deleted by accident with one click.
      sources_title: Sources and evidence
      sources_text: Attach parish registers, archive records and documents to facts — with how sure you are.
      map_title: The family on a map
      map_text: Births, marriages and moves, all on one map.
      kinship_title: How are we related?
      kinship_text: Pick two people and %{app} names the relationship — down to third cousins and great-grandparents.
      gedcom_title: GEDCOM import and export
      gedcom_text: Bring your tree from MyHeritage, Ancestry or Gramps, and take it back any time.
    letter:
      title: Why I'm making this
      body:
        - In almost every family, the story rests on a few people. Someone remembers great-grandmother's maiden name; someone has a box of unlabelled photos in a cupboard. Yet genealogy software is built for one dedicated person at a computer.
        - It works the other way here. You send your relatives a link, and everyone adds what they remember. It should be as easy for your grandmother as it is for you — that's what I design every screen for.
        - A family's story is something you hand down, so it has to stay yours. There are no ads, your data is never sold, and you can download the whole tree at any time. The code is open — even if something happens to me, your tree won't be lost.
        - Thank you for gathering your family's story. I hope this helps.
      name: Andrei Yurik
      role: maker of the service
    trust:
      title: Your data is yours
      lede: Family history is too important to be held hostage.
      russia_title: Stored in Russia
      russia_text: Servers and backups are in a Russian data center, as Federal Law 152-FZ requires.
      ads_title: No ads, no tracking
      ads_text: There are no ads or trackers inside the app. We earn from subscriptions, not from your data.
      living_title: Living people stay private
      living_text: Only your tree's members see information about living relatives.
      export_title: Download or delete any time
      export_text: Your tree downloads as GEDCOM, the standard every genealogy program reads — with every photo, in one archive. Deleting your account is one step.
      open_title: Open source
      open_text: The code is open. Even if something happens to us, your tree won't disappear.
      backup_title: Backups
      backup_text: Data is copied every 6 hours, and every copy is checked.
      policy: How we handle your data
    pricing:
      title: Pricing
      free_title: Free
      free_price: "0 ₽"
      free_text: "Up to %{limit} people per tree, every feature, as many relatives as you like."
      family_title: Family
      family_price: Soon
      family_text: No limit on people. If the subscription ends, your data is never locked or deleted.
    faq:
      title: Questions
      safe_q: Is it safe?
      safe_a: Only the people you invite can open your tree. Passwords are stored as hashes, connections are encrypted, and data is backed up regularly.
      shutdown_q: What if %{app} shuts down?
      shutdown_a: You can download your tree with all its photos at any time. And the code is open — you can run it on your own server.
      move_q: Can I move my tree from MyHeritage or Ancestry?
      move_a: Yes. Export your tree as GEDCOM there and upload it to %{app} — people, families and events come across.
      relatives_q: Do relatives need an account?
      relatives_a: To look — no, a view-only link is enough, and living relatives stay hidden on it. To answer your question — no either, the question's link is enough. To add to the tree — yes, it takes a minute through your invite link.
      living_q: Who sees my living relatives?
      living_a: Only your tree's members. Living people are hidden from everyone else.
      price_q: How much does it cost?
      price_a: "A tree of up to %{limit} people is free, forever. The paid plan removes the limit."
    final:
      route: Where to start looking for your ancestors
      title: Start with yourself — your family will tell you the rest
      cta: Create a tree for free
    footer:
      operator: "%{name} · INN %{inn} · OGRN %{ogrn} · %{email}"
      source: Source code
      tagline: The family tree your whole family builds.

