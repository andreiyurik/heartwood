# Russian for the strings Rails itself ships only in English (validation messages, number and
# date formats, form helpers). App strings live in ru.yml.
ru:
  activerecord:
    errors:
      messages:
        record_invalid: "Возникли ошибки: %{errors}"
        restrict_dependent_destroy:
          has_one: "Невозможно удалить запись, так как существует зависимость: %{record}"
          has_many: "Невозможно удалить запись, так как существуют зависимости: %{record}"

  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: нужно подтвердить
      blank: не может быть пустым
      confirmation: не совпадает со значением поля %{attribute}
      empty: не может быть пустым
      equal_to: может иметь лишь значение, равное %{count}
      even: может иметь лишь чётное значение
      exclusion: имеет зарезервированное значение
      greater_than: может иметь значение большее %{count}
      greater_than_or_equal_to: может иметь значение большее или равное %{count}
      in: должно быть в диапазоне %{count}
      inclusion: недопустимое значение
      invalid: недопустимое значение
      less_than: может иметь значение меньшее чем %{count}
      less_than_or_equal_to: может иметь значение меньшее или равное %{count}
      model_invalid: "Возникли ошибки: %{errors}"
      not_a_number: не является числом
      not_an_integer: не является целым числом
      odd: может иметь лишь нечётное значение
      other_than: должно отличаться от %{count}
      password_too_long: слишком длинный
      present: нужно оставить пустым
      required: обязательное поле
      taken: уже занято
      too_long:
        one: слишком длинное (максимум %{count} символ)
        few: слишком длинное (максимум %{count} символа)
        many: слишком длинное (максимум %{count} символов)
        other: слишком длинное (максимум %{count} символа)
      too_short:
        one: слишком короткое (минимум %{count} символ)
        few: слишком короткое (минимум %{count} символа)
        many: слишком короткое (минимум %{count} символов)
        other: слишком короткое (минимум %{count} символа)
      wrong_length:
        one: неверной длины (может быть длиной ровно %{count} символ)
        few: неверной длины (может быть длиной ровно %{count} символа)
        many: неверной длины (может быть длиной ровно %{count} символов)
        other: неверной длины (может быть длиной ровно %{count} символа)

  date:
    abbr_day_names: [Вс, Пн, Вт, Ср, Чт, Пт, Сб]
    abbr_month_names: [~, янв., февр., марта, апр., мая, июня, июля, авг., сент., окт., нояб., дек.]
    day_names: [воскресенье, понедельник, вторник, среда, четверг, пятница, суббота]
    formats:
      default: "%d.%m.%Y"
      short: "%-d %b"
    order: [day, month, year]

  time:
    am: утра
    pm: вечера
    formats:
      default: "%a, %d %b %Y, %H:%M:%S %z"
      long: "%-d %B %Y, %H:%M"
      short: "%-d %b, %H:%M"

  datetime:
    prompts:
      year: Год
      month: Месяц
      day: День
      hour: Часы
      minute: Минуты
      second: Секунды
    relative:
      future: через %{time}
      past: "%{time} назад"

  helpers:
    select:
      prompt: Выберите
    submit:
      create: Создать %{model}
      submit: Сохранить %{model}
      update: Сохранить %{model}

  number:
    format:
      delimiter: " "
      precision: 3
      round_mode: default
      separator: ","
      significant: false
      strip_insignificant_zeros: false
    currency:
      format:
        delimiter: " "
        format: "%n %u"
        negative_format: "-%n %u"
        precision: 2
        separator: ","
        significant: false
        strip_insignificant_zeros: false
        unit: ₽
    percentage:
      format:
        delimiter: ""
        format: "%n%"
    precision:
      format:
        delimiter: ""
    human:
      format:
        delimiter: ""
        precision: 1
        significant: false
        strip_insignificant_zeros: true
      storage_units:
        format: "%n %u"
        units:
          byte:
            one: байт
            few: байта
            many: байт
            other: байта
          kb: КБ
          mb: МБ
          gb: ГБ
          tb: ТБ
          pb: ПБ
          eb: ЭБ
          zb: ЗБ
      decimal_units:
        format: "%n %u"
        units:
          unit: ""
          thousand: тыс.
          million: млн
          billion: млрд
          trillion: трлн
          quadrillion: квадрлн
