      title_mark: пока есть кого спросить
      lede: Создайте древо и отправьте родным ссылку — каждый добавит то, что помнит. Бабушка назовёт девичью фамилию прабабушки, дядя — где служил дед, а вы увидите всё сразу, на одном древе.
      cta: Начать бесплатно
