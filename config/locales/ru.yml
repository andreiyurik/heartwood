      sign_in: Войти
      note: "Бесплатно до %{limit} человек. Без банковской карты и без рекламы."
      image_alt: Семейное древо в Heartwood
    pain:
      title: Память семьи уходит тихо
      stories_title: Рассказы никто не записал
      stories_text: То, что помнят бабушки и дедушки, живёт только в их памяти. Мы каждый год откладываем расспросы — а потом спросить уже некого.
      photos_title: Фотографии без подписей
      photos_text: Старые снимки лежат в коробках и семейных чатах. Через поколение никто не вспомнит, кто на них.
      pieces_title: У каждого — свой кусочек
      pieces_text: Тётя знает про одну ветку, троюродный брат — про другую. Вместе это история семьи, порознь — обрывки.
    how:
      title: Как это работает
      create_title: Создайте древо
      create_text: Начните с себя, родителей, бабушек и дедушек — это пара минут. Или загрузите готовое древо из файла GEDCOM.
      invite_title: Отправьте ссылку родным
      invite_text: Одна ссылка в семейный чат — и родственники присоединяются к древу, чтобы дополнять его.
      together_title: Заполняйте вместе
      together_text: Изменения появляются у всех сразу, без перезагрузки страницы. Каждая правка видна в истории, любую ошибку можно отменить.
    why:
      title: Зачем знать историю своей семьи
      lede: Это не только про прошлое. Это про то, какими вырастут ваши дети.
      research: Психологи Университета Эмори Маршалл Дьюк и Робин Фивуш выяснили, что дети, которые знают истории своей семьи — где познакомились родители, через что прошли бабушки и дедушки, — увереннее в себе и легче справляются с трудностями. Они чувствуют себя частью чего-то большего, чем они сами.
      roots_title: Люди, а не даты
      roots_text: Не просто список имён, а кто кем был, где жил, через что прошёл. История, которую можно рассказать.
      legacy_title: То, что передают по наследству
      legacy_text: Древо переживёт телефоны и соцсети. Вы оставите детям и внукам то, чего, возможно, не было у вас.
      talk_title: Повод поговорить
      talk_text: Расспросить бабушку о её молодости — может быть, лучший разговор за последние годы. Древо даёт для него повод.
    features:
      title: Всё, что нужно, чтобы собрать древо всерьёз
      live_title: Вместе и в реальном времени
      live_text: Несколько родственников правят одно древо одновременно — изменения видны всем сразу.
      history_title: История и отмена
      history_text: Видно, кто и что поменял. Случайно удалённого человека можно восстановить одной кнопкой.
      sources_title: Источники и доказательства
      sources_text: Прикрепляйте к фактам метрические книги, архивные справки и записи — с оценкой достоверности.
      map_title: Карта жизни семьи
      map_text: Места рождений, браков и переездов — на одной карте.
      kinship_title: Кем мы друг другу приходимся
      kinship_text: Выберите двух людей — и Heartwood назовёт родство, вплоть до троюродных и прадедушек.
      gedcom_title: Импорт и экспорт GEDCOM
      gedcom_text: Перенесите древо из MyHeritage, «Древа Жизни» или Gramps и заберите его обратно в любой момент.
    trust:
      title: Ваши данные — ваши
      lede: Семейная история слишком важна, чтобы держать её в заложниках.
      russia_title: Хранятся в России
      russia_text: Серверы и резервные копии находятся в российском дата-центре, как требует 152-ФЗ.
      ads_title: Без рекламы и слежки
      ads_text: Внутри приложения нет рекламы и счётчиков. Мы зарабатываем на подписке, а не на ваших данных.
      living_title: Живые скрыты от посторонних
      living_text: Сведения о живых родственниках видят только участники вашего древа.
      export_title: Скачать или удалить в любой момент
      export_text: Древо скачивается вместе со всеми фотографиями, в формате GEDCOM — стандарте, который понимает любая программа для генеалогии. Аккаунт удаляется в один шаг.
      open_title: Открытый код
      open_text: Код Heartwood открыт. Даже если с нами что-то случится, ваше древо не пропадёт.
      backup_title: Резервные копии
      backup_text: Данные копируются каждые 6 часов, и каждая копия проверяется.
      policy: Как мы обрабатываем данные
    pricing:
      title: Цены
      free_title: Бесплатно
      free_price: 0 ₽
      free_text: "До %{limit} человек в древе, все возможности, сколько угодно родственников."
      family_title: Семейный
      family_price: Скоро
      family_text: Без ограничений на число людей. Если подписка закончится, данные не заблокируются и не удалятся.
    faq:
      title: Частые вопросы
      safe_q: Это безопасно?
      safe_a: Доступ к древу есть только у тех, кого вы пригласили. Пароли хранятся в виде хэша, соединение зашифровано, данные регулярно копируются.
      shutdown_q: Что будет, если Heartwood закроется?
      shutdown_a: Вы в любой момент можете скачать древо вместе со всеми фотографиями. А код Heartwood открыт — его можно запустить на своём сервере.
      move_q: Можно перенести древо из MyHeritage или «Древа Жизни»?
      move_a: Да. Выгрузите древо в формате GEDCOM в той программе и загрузите в Heartwood — люди, семьи и события перенесутся.
      relatives_q: Родственникам нужно регистрироваться?
      relatives_a: Чтобы дополнять древо — да, это минута по вашей ссылке. Владелец решает, кто может редактировать, а кто только смотреть.
      living_q: Кто увидит моих живых родственников?
      living_a: Только участники вашего древа. Для всех остальных живые люди скрыты.
      price_q: Сколько это стоит?
      price_a: "Древо до %{limit} человек — бесплатно и навсегда. Платный тариф снимает ограничение."
    final:
      title: Начните с себя — остальное подскажет семья
      cta: Создать древо бесплатно
    footer:
      source: Исходный код
      tagline: Семейное древо, которое собирает вся семья.

